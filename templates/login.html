<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FaceAttend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <script>
        function toggleForm() {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('register-form').classList.toggle('hidden');
            document.getElementById('form-title').innerText = document.getElementById('login-form').classList.contains('hidden') ? 'Create Teacher Account' : 'Welcome Back';
            document.getElementById('form-subtitle').innerText = document.getElementById('login-form').classList.contains('hidden') ? 'Start managing your smart class today.' : 'Please enter your details to sign in.';
        }
    </script>
</head>

<body class="bg-gray-900 text-white min-h-screen flex">

    <!-- Left Side: Hero / Brand -->
    <div
        class="hidden md:flex w-1/2 bg-gradient-to-br from-blue-900 to-gray-900 relative overflow-hidden items-center justify-center">
        <!-- Abstract Circles -->
        <div class="absolute top-0 left-0 w-full h-full opacity-20">
            <div class="absolute w-96 h-96 bg-blue-500 rounded-full blur-3xl -top-20 -left-20"></div>
            <div class="absolute w-96 h-96 bg-indigo-500 rounded-full blur-3xl bottom-0 right-0"></div>
        </div>

        <div class="relative z-10 text-center px-10">
            <div class="flex justify-center mb-6">
                <!-- Large Logo Icon -->
                <svg class="w-24 h-24 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <h2 class="text-4xl font-bold mb-4">FaceAttend Pro</h2>
            <p class="text-blue-200 text-lg">Next-Gen AI Attendance Management System using Facial Recognition.</p>
        </div>
    </div>

    <!-- Right Side: Auth Form -->
    <div class="w-full md:w-1/2 flex items-center justify-center p-8 bg-gray-900">
        <div class="w-full max-w-md space-y-8">

            <!-- Mobile Logo (visible only on small screens) -->
            <div class="md:hidden flex justify-center mb-6">
                <svg class="w-16 h-16 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>

            <div class="text-center">
                <h2 id="form-title" class="text-3xl font-bold tracking-tight text-white">Welcome Back</h2>
                <p id="form-subtitle" class="mt-2 text-sm text-gray-400">Please enter your details to sign in.</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" action="/login" method="post" class="mt-8 space-y-6">
                <div class="space-y-4">
                    <div>
                        <label for="email" class="sr-only">Email address</label>
                        <input id="email" name="email" type="email" required
                            class="relative block w-full rounded-md border border-gray-700 bg-gray-800 px-3 py-3 text-white placeholder-gray-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 sm:text-sm"
                            placeholder="Email address">
                    </div>
                    <div>
                        <label for="password" class="sr-only">Password</label>
                        <input id="password" name="password" type="password" required
                            class="relative block w-full rounded-md border border-gray-700 bg-gray-800 px-3 py-3 text-white placeholder-gray-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 sm:text-sm"
                            placeholder="Password">
                    </div>
                </div>

                <div class="border-t border-gray-700 pt-4">
                    <button type="submit"
                        class="group relative flex w-full justify-center rounded-md bg-blue-600 px-3 py-3 text-sm font-semibold text-white hover:bg-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 transition-all">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                            <svg class="h-5 w-5 text-blue-300 group-hover:text-blue-200" fill="none" viewBox="0 0 24 24"
                                stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
                            </svg>
                        </span>
                        Sign In
                    </button>

                    <!-- Demo Box -->
                    <div class="mt-6 p-4 bg-gray-800/50 border border-dashed border-gray-700 rounded-lg text-center cursor-pointer hover:bg-gray-800 hover:border-gray-600 transition group"
                        onclick="document.querySelector('#login-form input[name=\'email\']').value='admin@school.com'; document.querySelector('#login-form input[name=\'password\']').value='admin123';">
                        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Testing?</p>
                        <p class="text-blue-400 font-mono text-sm group-hover:text-blue-300 font-bold">admin@school.com
                            / admin123</p>
                        <p class="text-xs text-gray-600 mt-1">Tap to auto-fill</p>
                    </div>
                </div>

                <p class="text-center text-sm text-gray-500">
                    New Teacher?
                    <a href="#" onclick="toggleForm()" class="font-medium text-blue-400 hover:text-blue-300">Register as
                        a Teacher</a>
                </p>
            </form>

            <!-- Register Form -->
            <form id="register-form" action="/register" method="post" class="mt-8 space-y-6 hidden">
                <div class="space-y-4">
                    <div>
                        <label class="sr-only">Full Name</label>
                        <input name="name" type="text" required
                            class="relative block w-full rounded-md border border-gray-700 bg-gray-800 px-3 py-3 text-white placeholder-gray-400 focus:border-green-500 focus:outline-none focus:ring-1 focus:ring-green-500 sm:text-sm"
                            placeholder="Full Name">
                    </div>
                    <div>
                        <label class="sr-only">Email address</label>
                        <input name="email" type="email" required
                            class="relative block w-full rounded-md border border-gray-700 bg-gray-800 px-3 py-3 text-white placeholder-gray-400 focus:border-green-500 focus:outline-none focus:ring-1 focus:ring-green-500 sm:text-sm"
                            placeholder="Email address">
                    </div>
                    <div>
                        <label class="sr-only">Password</label>
                        <input name="password" type="password" required
                            class="relative block w-full rounded-md border border-gray-700 bg-gray-800 px-3 py-3 text-white placeholder-gray-400 focus:border-green-500 focus:outline-none focus:ring-1 focus:ring-green-500 sm:text-sm"
                            placeholder="Create Password">
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="group relative flex w-full justify-center rounded-md bg-green-600 px-3 py-3 text-sm font-semibold text-white hover:bg-green-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-600 transition-all">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                            <svg class="h-5 w-5 text-green-200 group-hover:text-green-100" fill="none"
                                viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M19 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM3.75 6C3.75 3.65 5.36 1.7 7.5 1.25m0 20.25c-1.2 0-2.315-.36-3.23-1.025" />
                            </svg>
                        </span>
                        Register Teacher
                    </button>
                </div>

                <p class="text-center text-sm text-gray-500">
                    Already registered?
                    <a href="#" onclick="toggleForm()" class="font-medium text-green-400 hover:text-green-300">Sign
                        in</a>
                </p>
            </form>

        </div>
    </div>
</body>

</html>
