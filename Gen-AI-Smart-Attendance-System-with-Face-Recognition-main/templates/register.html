{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>Register New Student</h2>
    <form action="/register_student" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required placeholder="e.g. John Doe">
        </div>

        <div class="form-group">
            <label for="roll_number">Roll Number</label>
            <input type="text" id="roll_number" name="roll_number" required placeholder="e.g. CS202601">
        </div>

        <div class="form-group">
            <label for="image">Profile Photo</label>
            <input type="file" id="image" name="file" accept="image/*" required>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem">Upload a clear photo of the
                student's face.</p>
        </div>

        <button type="submit" class="btn">Register Student</button>
    </form>
</div>
{% endblock %}
