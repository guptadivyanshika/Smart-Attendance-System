<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - FaceAttend</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white min-h-screen">
    <nav class="bg-gray-800 p-4 shadow-md flex justify-between items-center">
        <div class="text-xl font-bold text-blue-400">FaceAttend</div>
        <div class="flex gap-4 items-center">
            <span>Welcome, {{ teacher_email }}</span>
            <a href="/logout" class="bg-red-600 px-3 py-1 rounded text-sm hover:bg-red-500">Logout</a>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-bold">Your Classrooms</h2>
            <button onclick="document.getElementById('new-class-modal').classList.remove('hidden')"
                class="bg-green-600 px-4 py-2 rounded hover:bg-green-500">+ New Class</button>
        </div>

        <!-- Class Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            {% for classroom in classrooms %}
            <div class="bg-gray-800 p-6 rounded-lg shadow hover:bg-gray-750 border border-gray-700 relative group">
                <form action="/classrooms/{{ classroom.id }}/delete" method="post"
                    onsubmit="return confirm('Delete {{ classroom.name }}? This will remove ALL students and attendance in this class.');"
                    class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button type="submit" class="text-red-500 hover:text-red-400 font-bold p-2 text-xl"
                        title="Delete Class">×</button>
                </form>
                <h3 class="text-2xl font-bold mb-2">{{ classroom.name }}</h3>
                <p class="text-gray-400 mb-4">Manage students and attendance.</p>
                <a href="/classrooms/{{ classroom.id }}"
                    class="block text-center bg-blue-600 py-2 rounded hover:bg-blue-500 transition">Enter Classroom</a>
            </div>
            {% endfor %}

            {% if not classrooms %}
            <div class="col-span-3 text-center text-gray-500 py-10">
                No classrooms found. Create one to get started!
            </div>
            {% endif %}
        </div>
    </div>

    <!-- Modal -->
    <div id="new-class-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-gray-800 p-6 rounded w-96">
            <h3 class="text-xl font-bold mb-4">Create New Classroom</h3>
            <form action="/classrooms" method="post">
                <input type="text" name="name" placeholder="Class Name (e.g. Math 101)" required
                    class="w-full p-2 mb-4 rounded bg-gray-700 border border-gray-600">
                <div class="flex gap-2 justify-end">
                    <button type="button" onclick="document.getElementById('new-class-modal').classList.add('hidden')"
                        class="px-4 py-2 bg-gray-600 rounded">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-green-600 rounded">Create</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
